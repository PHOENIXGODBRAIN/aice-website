<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIEC Protocol // SAFETY INTERLOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* Base Reset & Variables */
      :root {
        --color-void: #050505;
        --color-cyan: #00F3FF;
        --color-gold: #FFD700;
        --color-orange: #FF4500;
      }
      
      body {
        background-color: var(--color-void);
        color: white;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        margin: 0;
        cursor: crosshair;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-void);
      }
      ::-webkit-scrollbar-thumb {
        background: #1a1a1a;
        border: 1px solid var(--color-cyan);
      }

      /* Analog Noise Overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 50;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Scanline Effect */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 51;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
        background-size: 100% 4px;
        animation: scanlineScroll 10s linear infinite;
      }

      @keyframes scanlineScroll {
        0% { background-position: 0 0; }
        100% { background-position: 0 100%; }
      }

      /* Glitch Keyframes */
      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }

      .glitch-text:hover {
        animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        color: var(--color-cyan);
        text-shadow: 2px 2px var(--color-orange), -2px -2px var(--color-gold);
      }

      /* Event Horizon Pulse */
      @keyframes horizonPulse {
        0% { box-shadow: 0 0 20px var(--color-cyan), inset 0 0 10px var(--color-cyan); opacity: 0.8; }
        50% { box-shadow: 0 0 60px var(--color-cyan), inset 0 0 30px var(--color-gold); opacity: 1; }
        100% { box-shadow: 0 0 20px var(--color-cyan), inset 0 0 10px var(--color-cyan); opacity: 0.8; }
      }

      .event-horizon {
        animation: horizonPulse 4s infinite ease-in-out;
      }
    </style>

{

  }
}
</script>

  </body>
</html>
